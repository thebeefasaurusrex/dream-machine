  $("#tries").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { $("#forgeIn").value = b.textContent; printName(b.textContent); } });
  return printName;
}
let printName = null;
const selSlot = document.getElementById("dm-select-slot");
if (window.DMSelect) {
  DMSelect.mount(selSlot, { mode: "manual", theme: "paper" });
  $("#selWrap").insertAdjacentHTML("afterbegin", `<div class="selbar"><span>Scroll inside the screen, or unfold it</span><button type="button" class="btnp alt" id="unfoldBtn">Unfold it full size</button></div>`);
  const home = $("#selWrap");
  $("#unfoldBtn").addEventListener("click", () => { $("#foldInner").append(selSlot); $("#foldout").classList.add("open"); $("#foldClose").focus(); dispatchEvent(new Event("resize")); });
  const fold = () => { if (!$("#foldout").classList.contains("open")) return; home.append(selSlot); $("#foldout").classList.remove("open"); dispatchEvent(new Event("resize")); $("#unfoldBtn").focus(); };
  $("#foldClose").addEventListener("click", fold);
  document.addEventListener("keydown", e => { if (e.key === "Escape") fold(); });
} else {
  printName = hintLine(selSlot);
}

/* ---------- lightbox ---------- */
const lb = $("#lightbox");
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lb]"); if (!b) return;
  const im = IMG[b.dataset.lb]; const img = b.querySelector("img"); const cap = b.closest("figure").querySelector("figcaption");
  $("#lbImg").src = im ? im.src : img.src; $("#lbImg").alt = img.alt;
  $("#lbTitle").textContent = img.alt; $("#lbCap").innerHTML = cap ? cap.innerHTML : "";
  if (lb.showModal) lb.showModal(); else lb.setAttribute("open", "");
});
$("#lbClose").addEventListener("click", () => lb.close ? lb.close() : lb.removeAttribute("open"));
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });

/* ---------- the book ---------- */
const book = $("#book"), wrap = $("#bookWrap");
const leaves = [];
let cur = 0, busy = false, mode = null, dest = 0, pending = null, wantPage = null;
const pos = () => busy ? (pending ?? dest) : cur;
function buildLeaves(){
  if (leaves.length) return;
  for (let k = 0; k < LEAVES; k++) {
    const leaf = document.createElement("div"); leaf.className = "leaf";
    const f = document.createElement("div"); f.className = "face front";
    const b = document.createElement("div"); b.className = "face back";
    f.innerHTML = b.innerHTML = '<div class="shade"></div>';
    leaf.append(f, b); book.append(leaf); leaves.push({ leaf, f, b });
  }
}
function toBook(){
  buildLeaves();
  leaves.forEach(({ f, b }, k) => { if (pageEls[2 * k]) f.prepend(pageEls[2 * k]); if (pageEls[2 * k + 1]) b.prepend(pageEls[2 * k + 1]); });
  document.body.classList.add("book-mode"); document.body.classList.remove("phone-mode", "onepage");
  apply(cur); fit();
}
function toColumn(){
  const col = $("#column"); pageEls.forEach(p => { p.inert = false; col.append(p); });
  document.body.classList.remove("book-mode"); document.body.classList.add("phone-mode");
  document.body.classList.toggle("onepage", onePage && !mqPhone.matches);
  fitName();
}
const shiftFor = s => s === 0 ? -PW / 2 : s === LAST ? PW / 2 : 0;
function setLeaf(k, turned){
  const L = leaves[k].leaf;
  if (hasGsap) gsap.set(L, { rotationY: turned ? -180 : 0 }); else L.style.transform = `rotateY(${turned ? -180 : 0}deg)`;
}
function apply(s){
  leaves.forEach(({ leaf, f, b }, k) => {
    const turned = k < s;
    setLeaf(k, turned);
    leaf.style.zIndex = turned ? 10 + k : 100 - k;
    leaf.style.display = (k === s - 1 || k === s) ? "" : "none";
    f.inert = !(k === s && !turned); b.inert = !(k === s - 1);
    if (hasGsap) gsap.set([f.querySelector(".shade"), b.querySelector(".shade")], { opacity: 0 });
  });
  if (hasGsap) gsap.set(book, { x: shiftFor(s) }); else book.style.transform = `translateX(${shiftFor(s)}px)`;
  const L = $(".stack.L"), R = $(".stack.R");
  const nl = Math.max(0, s - 1), nr = Math.max(0, LEAVES - s - 1);
  const edge = (n, dir) => Array.from({ length: Math.min(n, 9) }, (_, i) => `${dir * (i + 1) * 1.3}px ${(i + 1) * .7}px 0 0 ${i % 2 ? "#E6DCC1" : "#CDBF9D"}`).concat(["0 26px 50px rgba(50,35,10,.35)"]).join(",");
  L.style.display = s > 0 ? "" : "none"; R.style.display = s < LAST ? "" : "none";
  L.style.boxShadow = edge(nl, -1); R.style.boxShadow = edge(nr, 1);
  ui(s);
}
function spreadPages(s){ return s === 0 ? [0] : [2 * s - 1, 2 * s].filter(p => p <= LASTP); }
function ui(s){
  const ps = spreadPages(s);
  const title = ps.map(p => PAGES[p].title).filter((t, i, a) => a.indexOf(t) === i).join(" · ");
  $("#where").textContent = title;
  const label = s === 0 ? "Cover" : s === LAST ? "Back cover" : ps.length > 1 ? `Pages ${ps[0]} and ${ps[1]}` : `Page ${ps[0]}`;
  $("#pageLabel").textContent = label;
  $("#live").textContent = label + ": " + title;
  $("#prev").disabled = s === 0; $("#next").disabled = s === LAST;
  $("#scrub").value = s;
  $("#edgeTabs").style.display = s === LAST ? "none" : "";
  let active = null; for (const [, id] of TABS) if (IDX[id] <= Math.max(...ps)) active = id;
  $$("#edgeTabs button").forEach(b => b.setAttribute("aria-current", active && +b.dataset.page === IDX[active] ? "true" : "false"));
  if (ps.includes(IDX.characters)) requestAnimationFrame(fitName);
  const hashId = wantPage != null && ps.includes(wantPage) ? PAGES[wantPage].id : PAGES[ps[0]].id;
  setHash(hashId);
}
function setHash(id){
  if (OG) return;
  const want = "#" + id;
  if (location.hash !== want || location.search) { try { history.replaceState(null, "", location.pathname + want); } catch (e) {} }
}
function go(target){
  if (mode === "phone") { scrollToPage(target === 0 ? 0 : 2 * target - 1); return; }
  target = Math.max(0, Math.min(LAST, target));
  if (busy) { pending = target === dest ? null : target; return; }
  if (target === cur) { ui(cur); return; }
  const from = cur, dir = target > from ? 1 : -1;
  const lo = Math.min(from, target), hi = Math.max(from, target);
  if (!hasGsap || DM.reduced) { cur = target; apply(cur); return; }
  if (hi - lo > 3) { const snap = target - dir * 3; cur = snap; apply(snap); return go(target); }
  busy = true; dest = target;
  leaves.forEach(({ leaf, f, b }, k) => { leaf.style.display = (k >= lo - 1 && k <= hi) ? "" : "none"; f.inert = b.inert = true; });
  const turning = dir > 0 ? Array.from({ length: hi - lo }, (_, i) => lo + i) : Array.from({ length: hi - lo }, (_, i) => hi - 1 - i);
  const many = turning.length > 1, D = many ? .55 : .85, gap = many ? .11 : 0;
  const tl = gsap.timeline({ onComplete: () => { busy = false; cur = target; apply(cur); if (pending !== null) { const p = pending; pending = null; go(p); } } });
  turning.forEach((k, i) => {
    const { leaf, f, b } = leaves[k];
    tl.set(leaf, { zIndex: 300 + i }, i * gap);
    tl.to(leaf, { rotationY: dir > 0 ? -180 : 0, duration: D, ease: "power2.inOut" }, i * gap);
    tl.to([f.querySelector(".shade"), b.querySelector(".shade")], { opacity: .6, duration: D / 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, i * gap);
  });
  tl.to(book, { x: shiftFor(target), duration: D + gap * (turning.length - 1), ease: "power2.inOut" }, 0);
  ui(target);
}
// go to a page (by index); in the column, scroll to it (or to an element inside it)
function goPage(p, el){
  wantPage = p;
  if (mode === "phone") { quietScroll(); (el || pageEls[p]).scrollIntoView({ behavior: DM.reduced ? "auto" : "smooth", block: "start" }); setHash(PAGES[p].id); return; }
  closeSheet(); go(spreadOf(p));
}
function fit(){
  if (mode !== "book") return;
  const W = innerWidth, H = OG ? innerHeight : innerHeight - 54 - 62;
  const k = OG ? (H - 20) / PH : Math.min((W - 60) / (PW * 2 + 40 + 190), (H - 24) / PH, 1.35);
  wrap.style.transform = `scale(${k})`;
}
function scrollToPage(p){ const el = pageEls[p]; if (el) { quietScroll(); el.scrollIntoView({ behavior: DM.reduced ? "auto" : "smooth", block: "start" }); setHash(PAGES[p].id); } }
function layout(){
  const m = mqPhone.matches || onePage ? "phone" : "book";
  if (m !== mode) {
    const keep = mode === "phone" ? currentColumnPage() : (mode === "book" ? spreadPages(cur)[0] : null);
    mode = m;
    if (m === "book") { if (keep != null) cur = spreadOf(keep); toBook(); }
    else { toColumn(); if (keep != null && keep > 0) requestAnimationFrame(() => pageEls[keep].scrollIntoView({ block: "start" })); }
  }
  document.body.classList.toggle("onepage", mode === "phone" && onePage && !mqPhone.matches);
  applyFit();
  $("#viewBtn").textContent = onePage ? "Booklet" : "One page";
  $("#viewBtn").setAttribute("aria-pressed", onePage ? "true" : "false");
  fit();
}

/* roster pages: if the estimate packed a page a little too full, shrink that page to fit (book only) */
function measureFit(){
  const probe = document.createElement("section"); probe.className = "page"; probe.style.cssText = "position:absolute;left:-10000px;top:0;height:auto;visibility:hidden";
  document.body.append(probe);
  for (const w of $$(".fitwrap")) {
    const parent = w.parentNode, next = w.nextSibling;
    w.style.transform = ""; w.style.width = "";
    probe.append(w); const h = w.getBoundingClientRect().height; parent.insertBefore(w, next);
    w.dataset.k = Math.min(1, 646 / h).toFixed(4);
  }
  probe.remove(); applyFit();
}
function applyFit(){
  for (const w of $$(".fitwrap")) {
    const k = +w.dataset.k || 1, on = mode === "book" && k < 1;
    w.style.transformOrigin = "0 0"; w.style.transform = on ? `scale(${k})` : ""; w.style.width = on ? (100 / k) + "%" : "";
  }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureFit); else setTimeout(measureFit, 500);

/* column mode: track the page in view for the label and the link */
let colPage = 0;
function currentColumnPage(){ return colPage; }
const colIO = "IntersectionObserver" in window ? new IntersectionObserver(es => {
  if (mode !== "phone") return;
  const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
  if (vis) { colPage = +vis.target.dataset.p; $("#where").textContent = PAGES[colPage].title; if (!scrolling) setHash(PAGES[colPage].id); }
}, { rootMargin: "-60px 0px -70% 0px" }) : null;
let scrolling = false, scrollTimer = 0;
function quietScroll(){ scrolling = true; clearTimeout(scrollTimer); scrollTimer = setTimeout(() => { scrolling = false; }, 1000); }
if (colIO) pageEls.forEach(p => colIO.observe(p));

/* ---------- controls ---------- */
$("#scrub").max = LAST;
$("#scrub").addEventListener("input", e => { wantPage = null; go(+e.target.value); });
$("#prev").addEventListener("click", () => { wantPage = null; go(pos() - 1); });
$("#next").addEventListener("click", () => { wantPage = null; go(pos() + 1); });
document.addEventListener("click", e => {
  const d = e.target.closest("[data-go]"); if (d) { e.preventDefault(); wantPage = null; go(pos() + (+d.dataset.go)); return; }
  const t = e.target.closest("[data-page]"); if (t) { e.preventDefault(); closeSheet(); goPage(+t.dataset.page); return; }
  const g = e.target.closest("[data-goto]"); if (g) { e.preventDefault(); const i = IDX[g.dataset.goto]; if (i != null) goPage(i); }
});
$("#brandLink").addEventListener("click", e => { e.preventDefault(); if (mode === "phone") { scrollTo({ top: 0, behavior: DM.reduced ? "auto" : "smooth" }); setHash("cover"); } else { wantPage = 0; go(0); } });
$("#viewBtn").addEventListener("click", () => {
  onePage = !onePage;
  try { localStorage.setItem("dm-manual-view", onePage ? "onepage" : "book"); } catch (e) {}
  layout();
});
$("#skipLink").addEventListener("click", e => {
  e.preventDefault();
  if (!onePage && !mqPhone.matches) { onePage = true; layout(); }
  $("#column").focus({ preventScroll: true }); scrollTo({ top: 0 });
});
function closeSheet(){ sheet.classList.remove("open"); $("#tocBtn").setAttribute("aria-expanded", "false"); }
$("#tocBtn").addEventListener("click", e => { e.stopPropagation(); const open = !sheet.classList.contains("open"); sheet.classList.toggle("open", open); $("#tocBtn").setAttribute("aria-expanded", open ? "true" : "false"); if (open) sheet.querySelector("button").focus(); });
document.addEventListener("click", e => { if (!e.target.closest("#sheet,#tocBtn")) closeSheet(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeSheet(); return; }
  if (mode !== "book" || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.type === "range") return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); wantPage = null; go(pos() + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); wantPage = null; go(pos() - 1); }
  else if (e.key === "Home") { e.preventDefault(); wantPage = null; go(0); }
  else if (e.key === "End") { e.preventDefault(); wantPage = null; go(LAST); }
});
let wheelLock = 0;
$("#desk").addEventListener("wheel", e => {
  if (mode !== "book" || Math.abs(e.deltaY) < 24) return;
  const inner = e.target.closest("#dm-select-slot, .sheet"); if (inner && inner.scrollHeight > inner.clientHeight + 2) return;
  e.preventDefault(); const now = performance.now(); if (now < wheelLock) return; wheelLock = now + 650;
  wantPage = null; go(pos() + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });
let tx = null;
$("#desk").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
$("#desk").addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) { wantPage = null; go(pos() + (dx < 0 ? 1 : -1)); } tx = null; });

/* ---------- deep links: #page-id, #character/name, old site anchors, ?p= from the redirects ---------- */
const OLD = { what: "what-it-is", does: "screen-guide", upgrade: "making-of", how: "how-to-play" };
function route(){
  let h = ""; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = location.hash.slice(1); }
  if (h.startsWith("character/")) { const k = DM.keyOf(h.slice(10)); if (k && PUBLIC.includes(k)) { setBio(PUBLIC.indexOf(k)); return { page: IDX.characters, hash: h }; } }
  if (OLD[h]) h = OLD[h];
  if (h in IDX) return { page: IDX[h] };
  const from = Q.get("p");
  if (from && IDX[from] != null) return { page: IDX[from] };
  return { page: 0 };
}
addEventListener("hashchange", () => { const r = route(); goPage(r.page); });

addEventListener("resize", layout);
if (mqPhone.addEventListener) mqPhone.addEventListener("change", layout);
DM.onReduced(() => { if (busy && hasGsap) { gsap.globalTimeline.getChildren().forEach(t => t.progress(1)); } });
const start = route();
if (start.page) { cur = spreadOf(start.page); wantPage = start.page; }
layout();
if (mode === "phone" && start.page) { quietScroll(); } if (mode === "phone" && start.page) requestAnimationFrame(() => { pageEls[start.page].scrollIntoView({ block: "start" }); setHash(PAGES[start.page].id); });
else if (mode === "book") { if (start.hash) setTimeout(() => { try { history.replaceState(null, "", location.pathname + "#" + start.hash); } catch (e) {} }, 0); }
// testing hook
window.DMManual = { go, goPage, get spread(){ return cur; }, get busy(){ return busy; }, get mode(){ return mode; }, setBio, setStage, printName, pages: PAGES.map(p => p.id), IDX, LAST,
  // for the download tests: the exact text each download button saves
  download: name => { const src = kitSources(); return src ? dlBody(name, src) : null; }, listings: COPY };
})();
</script>
