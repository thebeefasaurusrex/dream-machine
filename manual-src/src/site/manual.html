<!--@FONTS Archivo Black|Archivo Narrow:ital,wght@0,400;0,600;0,700;1,600|Libre Baskerville:ital,wght@0,400;0,700;1,400|Luckiest Guy-->
<style>
:root{
  --paper:#F4EEDC; --paper2:#EAE1C6; --ink:#1B1712; --ink2:#4B4337; --faint:#8A7F6B;
  --red:#E1251B; --blue:#1C4FA0; --yel:#FFCF1F; --cy:#00A3E0; --mg:#E5007D; --grn:#2E8B57;
  --head:"Archivo Black","Arial Black",Impact,sans-serif;
  --cond:"Archivo Narrow","Arial Narrow","Roboto Condensed",sans-serif;
  --serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,Consolas,"Courier New",monospace;
  --fiber:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .34 0 0 0 0 .27 0 0 0 0 .16 0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --fiber2:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.05 .22' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .36 0 0 0 0 .2 0 0 0 .3 -.15'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font:13px/1.55 var(--serif);background:#CBC2AE;
  background-image:var(--fiber),radial-gradient(120% 90% at 50% 38%,#E9E2D2 0%,#D3CAB5 55%,#AFA48B 100%);min-height:100vh}
body.book-mode{overflow:hidden;height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
canvas{image-rendering:pixelated;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--yel);border:2px solid var(--ink);padding:8px 12px;font:700 13px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.skip:focus{top:8px}
code{font:12px/1.4 var(--mono);background:rgba(28,79,160,.1);padding:0 3px}
noscript p{max-width:640px;margin:90px auto;padding:20px;background:var(--paper);border:2px solid var(--ink)}

/* ---------- chrome ---------- */
.top{position:fixed;top:0;left:0;right:0;height:54px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 18px;
  background:rgba(244,238,220,.96);border-bottom:2px solid var(--ink);box-shadow:0 2px 0 var(--red)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand .mini{width:58px;height:40px;display:block;flex:none}
.brand b{font:400 15px/1 var(--head);letter-spacing:.04em;transform:skewX(-10deg);display:inline-block;white-space:nowrap}
.brand small{display:block;font:600 10px/1.2 var(--cond);letter-spacing:.22em;color:var(--red);transform:none}
.where{flex:1;text-align:center;font:700 12px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbtn{border:2px solid var(--ink);background:var(--paper);padding:7px 11px;font:700 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;box-shadow:2px 2px 0 var(--ink);text-decoration:none;color:var(--ink);display:inline-block;white-space:nowrap}
.tbtn:hover{background:var(--yel)}
.tbtn:active{transform:translate(2px,2px);box-shadow:none}
select.tbtn{padding:6px 8px;appearance:auto}
.cwpick{display:flex;align-items:center;gap:6px;font:700 10px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.ctl{position:fixed;bottom:0;left:0;right:0;height:62px;z-index:50;display:flex;align-items:center;justify-content:center;gap:14px}
.turn{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--red);color:#fff;font:400 18px/1 var(--head);box-shadow:3px 3px 0 var(--ink);flex:none}
.turn:disabled{background:#bdb4a0;cursor:default;box-shadow:none}
.turn:not(:disabled):active{transform:translate(3px,3px);box-shadow:none}
.scrub{display:flex;gap:10px;align-items:center;background:rgba(244,238,220,.94);border:2px solid var(--ink);padding:7px 12px;box-shadow:3px 3px 0 var(--ink)}
.scrub input{width:300px;accent-color:var(--red)}
.pagelabel{font:700 11px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;min-width:150px;text-align:center}
.sheet{position:fixed;top:60px;right:16px;z-index:60;width:320px;max-height:calc(100vh - 140px);overflow:auto;background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:10px 0;display:none}
.sheet.open{display:block}
.sheet button{display:flex;width:100%;gap:8px;border:0;background:none;padding:6px 16px;text-align:left;font:600 14px/1.2 var(--cond);letter-spacing:.04em;text-transform:uppercase}
.sheet button.subt{padding-left:30px;font-size:12.5px;color:var(--ink2)}
.sheet button i{flex:1;border-bottom:2px dotted var(--faint);transform:translateY(-4px)}
.sheet button:hover,.sheet button:focus-visible{background:var(--yel)}

/* ---------- desk + book ---------- */
#desk{position:fixed;left:0;right:0;top:54px;bottom:62px}
#bookWrap{position:absolute;left:50%;top:50%;width:1080px;height:740px;margin:-370px 0 0 -540px;transform-origin:50% 50%}
#book{position:relative;width:1080px;height:740px;perspective:2800px}
.stack{position:absolute;top:0;width:540px;height:740px;background:var(--paper2);z-index:0}
.stack.L{left:0}.stack.R{left:540px}
.leaf{position:absolute;left:540px;top:0;width:540px;height:740px;transform-origin:0 50%;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5}
.face.front .shade{background:linear-gradient(90deg,rgba(40,25,0,.55),rgba(40,25,0,.08) 60%,rgba(255,255,255,.2))}
.face.back .shade{background:linear-gradient(270deg,rgba(40,25,0,.55),rgba(40,25,0,.08) 60%,rgba(255,255,255,.2))}
.edgetabs{position:absolute;left:1080px;top:34px;display:flex;flex-direction:column;gap:6px;z-index:1}
.edgetabs button{width:86px;height:46px;border:2px solid var(--ink);border-left:0;border-radius:0 9px 9px 0;background:var(--tab,#ddd);color:var(--ink);padding:0 8px 0 10px;text-align:left;
  font:700 11px/1.05 var(--cond);letter-spacing:.12em;text-transform:uppercase;box-shadow:3px 3px 0 rgba(27,23,18,.35)}
.edgetabs button:hover,.edgetabs button[aria-current="true"]{width:94px;filter:brightness(1.06)}
.edgetabs button[aria-current="true"]{box-shadow:3px 3px 0 var(--ink)}

/* ---------- pages ---------- */
.page{position:relative;width:540px;height:740px;padding:36px 42px 54px;overflow:hidden;
  background-color:var(--paper);background-image:var(--fiber),var(--fiber2),radial-gradient(140% 110% at 50% 45%,transparent 55%,rgba(170,120,30,.16))}
.face.front .page::before,.face.back .page::before{content:"";position:absolute;top:0;bottom:0;width:46px;pointer-events:none;z-index:4}
.face.front .page::before{left:0;background:linear-gradient(90deg,rgba(60,40,10,.28),rgba(60,40,10,.06) 40%,transparent)}
.face.back .page::before{right:0;background:linear-gradient(270deg,rgba(60,40,10,.28),rgba(60,40,10,.06) 40%,transparent)}
.staple{position:absolute;width:5px;height:58px;z-index:6;background:linear-gradient(90deg,#8d8a83,#e7e4dc 45%,#7b776f);border-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.35)}
.face.front .staple{left:-2px}.face.back .staple{right:-2px}
.staple.s1{top:150px}.staple.s2{bottom:150px}
.folio{position:absolute;left:0;right:0;bottom:18px;text-align:center;font:700 11px/1 var(--cond);letter-spacing:.22em;color:var(--ink2)}
.folio::before,.folio::after{content:"";display:inline-block;width:26px;height:2px;background:var(--ink);vertical-align:middle;margin:0 10px}
.kick{font:700 11px/1 var(--cond);letter-spacing:.26em;text-transform:uppercase;color:var(--red);margin:0 0 8px}
.band{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.band > span,.band > h2{display:inline-block;background:var(--ink);color:var(--paper);font:400 23px/1 var(--head);padding:8px 16px 7px 12px;transform:skewX(-12deg);transform-origin:0 100%;letter-spacing:.01em;white-space:nowrap;margin:0}
.band::after{content:"";flex:1;height:7px;background:repeating-linear-gradient(90deg,var(--red) 0 20px,transparent 20px 25px)}
.band.blue > span,.band.blue > h2{background:var(--blue)}
.band.grn > span,.band.grn > h2{background:#1F6B45}
.mis{text-shadow:2px 1.5px 0 rgba(0,163,224,.7),-1.5px -1px 0 rgba(229,0,125,.55)}
h3.sub{font:400 19px/1.05 var(--head);margin:14px 0 6px;transform:skewX(-9deg);transform-origin:0 100%}
p{margin:0 0 9px}
.drop::first-letter{float:left;font:400 46px/.8 var(--head);color:var(--red);margin:4px 8px 0 0;text-shadow:2px 2px 0 var(--ink)}
.small{font-size:11.5px;line-height:1.5;color:var(--ink2)}
.dense{font-size:12.2px;line-height:1.52}
.cond{font-family:var(--cond)}
.btnp{display:inline-block;border:2px solid var(--ink);background:var(--yel);padding:8px 13px 7px;font:700 12px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btnp:hover{background:#fff}
.btnp:active{transform:translate(3px,3px);box-shadow:none}
.btnp.alt{background:var(--paper)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.plate{border:3px solid var(--ink);background:var(--ink);box-shadow:4px 4px 0 rgba(27,23,18,.25)}
.plate canvas{width:100%;height:auto}
.cap{font:600 11px/1.3 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.cap b{color:var(--red);margin-right:6px}
.dots{background-image:radial-gradient(var(--ink) .9px,transparent 1.3px);background-size:5px 5px}
.tagline{font:700 11px/1.3 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin:0 0 8px}

/* cover */
.page.cover{padding:0;background-color:#FFD21C}
.cv-burst{position:absolute;inset:0;background:repeating-conic-gradient(from 3deg at 50% 64%,#FFD21C 0 6deg,#FFB208 6deg 12deg)}
.cv-burst::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 64%,transparent 40%,rgba(225,37,27,.85) 100%)}
.cv-dots{position:absolute;inset:0;background-image:radial-gradient(#7a1206 1.1px,transparent 1.6px);background-size:7px 7px;
  -webkit-mask-image:radial-gradient(75% 60% at 50% 64%,transparent 45%,#000 95%);mask-image:radial-gradient(75% 60% at 50% 64%,transparent 45%,#000 95%);opacity:.55}
.cv-band{position:absolute;left:0;right:0;top:0;height:38px;background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 18px;
  font:700 12px/1 var(--cond);letter-spacing:.24em;border-bottom:4px solid var(--red)}
.cv-band span:last-child{color:var(--yel);letter-spacing:.14em}
.cv-logo{position:absolute;left:62px;right:62px;top:46px;z-index:3;filter:drop-shadow(5px 6px 0 rgba(27,23,18,.55))}
.cv-logo svg{width:100%;height:auto;display:block}
.cv-cast{position:absolute;left:42px;top:296px;width:456px;height:300px;z-index:4}
.cv-seal{position:absolute;right:16px;top:-58px;width:108px;height:108px;z-index:5;transform:rotate(12deg);filter:drop-shadow(3px 3px 0 rgba(27,23,18,.5))}
.cv-ed{position:absolute;left:16px;top:-30px;z-index:5;transform:rotate(-4deg);background:var(--red);color:var(--paper);border:3px solid var(--ink);padding:5px 10px 4px;
  font:400 15px/1 var(--head);letter-spacing:.02em;box-shadow:3px 3px 0 rgba(27,23,18,.55)}
.cv-ed small{display:block;font:700 9px/1.2 var(--cond);letter-spacing:.2em;color:var(--yel);margin-top:3px}
em.nu{flex:none;align-self:center;font:700 9px/1 var(--cond);letter-spacing:.14em;font-style:normal;background:var(--red);color:#fff;padding:2px 4px 1px;transform:translateY(-1px)}
.thennow{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.thennow .fig,.thennow .note{margin:0}
.rooms5.ed2 img{image-rendering:auto}
.cv-title{position:absolute;left:0;right:0;bottom:0;height:112px;background:var(--ink);color:var(--paper);padding:14px 22px 0;z-index:3;border-top:5px solid var(--blue)}
.cv-title h1{margin:0;display:block;font:400 30px/1 var(--head);transform:skewX(-11deg);transform-origin:0 100%;color:var(--yel)}
.cv-title h1.mis{text-shadow:2.5px 2px 0 rgba(0,163,224,.85),-2px -1px 0 rgba(229,0,125,.7)}
.cv-title span{display:block;font:italic 12.5px/1.45 var(--serif);margin-top:8px;color:#efe7d2;max-width:360px}
.cv-title em{position:absolute;right:20px;bottom:16px;font:700 10px/1.3 var(--cond);letter-spacing:.2em;text-align:right;font-style:normal;color:var(--yel)}
.dogear{position:absolute;right:0;bottom:0;width:64px;height:64px;border:0;padding:0;z-index:8;background:linear-gradient(135deg,transparent 49%,rgba(27,23,18,.35) 50%,#f7f1df 52%,#d8ccad 100%);
  clip-path:polygon(100% 0,100% 100%,0 100%);animation:curl 2.6s ease-in-out infinite}
.dogear.left{left:0;right:auto;background:linear-gradient(225deg,transparent 49%,rgba(27,23,18,.35) 50%,#f7f1df 52%,#d8ccad 100%);clip-path:polygon(0 0,100% 100%,0 100%)}
@keyframes curl{0%,100%{width:44px;height:44px}50%{width:66px;height:66px}}
.dm-reduced .dogear{animation:none;width:52px;height:52px}
.page:not(.cover) .dogear{animation:none;width:34px;height:34px;opacity:.85}
.page:not(.cover) .dogear:hover{width:52px;height:52px}

/* contents */
.toc{list-style:none;margin:0;padding:0}
.toc button{display:flex;align-items:baseline;width:100%;gap:8px;border:0;background:none;padding:1px 2px;text-align:left;font:600 14px/1.2 var(--cond);letter-spacing:.03em;text-transform:uppercase}
.toc button i{flex:1;border-bottom:2px dotted var(--ink2);transform:translateY(-4px)}
.toc button b{font:400 14px/1 var(--head)}
.toc button:hover{color:var(--red)}
.toc li.part button{font-size:12px;color:var(--red);letter-spacing:.2em;padding-top:7px}
.oldpages{margin-top:10px;border:2px solid var(--ink);padding:8px 11px;background:rgba(255,207,31,.25);font:600 11.5px/1.4 var(--cond);letter-spacing:.03em}
.oldpages b{display:block;font:400 13px/1.2 var(--head);margin-bottom:3px}

/* welcome */
.caution{border:3px solid var(--ink);padding:12px 14px 6px;margin:12px 0;background:rgba(255,255,255,.35);position:relative}
.caution h4{margin:0 0 8px;font:400 18px/1 var(--head);display:flex;gap:10px;align-items:center}
.caution ol{margin:0;padding-left:20px}
.caution li{margin:0 0 7px}
.mascot{display:flex;gap:12px;align-items:flex-end;margin-top:10px}
.mascot .plate{width:132px;flex:none}
.bubble{position:relative;border:2px solid var(--ink);background:#fff;padding:9px 12px;font:600 13px/1.35 var(--cond);border-radius:14px;margin-bottom:24px}
.bubble::after{content:"";position:absolute;left:-12px;bottom:12px;border:7px solid transparent;border-right:12px solid var(--ink)}

/* story + what */
.pull{font:italic 17px/1.4 var(--serif);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);padding:10px 2px;margin:12px 0;color:var(--blue)}
.box{border:2px solid var(--ink);padding:11px 13px;margin-top:10px;background:rgba(28,79,160,.08)}
.box h4{margin:0 0 6px;font:400 14px/1 var(--head);letter-spacing:.02em}
.lineup{margin:10px 0 0}

/* how to play */
.pad{width:100%;height:auto;display:block;margin:4px 0 6px}
.how4{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.how4 div{border-top:3px solid var(--ink);padding-top:6px}
.how4 h4{margin:0 0 3px;font:400 15px/1 var(--head);display:flex;align-items:center;gap:7px}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--yel);border:2px solid var(--ink);font:400 12px/1 var(--head);flex:none}
.how4 p{font-size:12px;line-height:1.45;margin:0}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feat li{display:grid;grid-template-columns:30px 1fr;gap:10px}
.feat .num{width:28px;height:28px;background:var(--ink);color:var(--paper);font-size:13px}
.feat h4{margin:0;font:700 14px/1.2 var(--cond);letter-spacing:.1em;text-transform:uppercase}
.feat p{margin:2px 0 0;font-size:12px;line-height:1.45}
.states{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.states span{font:700 10.5px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;border:2px solid var(--ink);padding:5px 8px 4px;background:#fff}
.states i{display:inline-block;width:9px;height:9px;margin-right:6px;border:1px solid var(--ink);vertical-align:-1px}

/* bio + index */
.bio-name{font:400 44px/1 var(--head);margin:2px 0 2px;white-space:nowrap;overflow:hidden;transform:skewX(-9deg);transform-origin:0 100%}
.bio-era{font:700 12px/1.2 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:12px}
.bio-row{display:flex;gap:16px;align-items:flex-start}
.bio-row .plate{width:236px;flex:none}
.bio-note{font-size:13px;line-height:1.55;margin:0}
.bio-note::first-letter{text-transform:uppercase}
.stats{margin-top:14px;border:3px solid var(--ink);background:#fff}
.stats-h{background:var(--ink);color:var(--paper);font:400 14px/1 var(--head);letter-spacing:.06em;padding:6px 10px;display:flex;justify-content:space-between}
.stats-h span{font:700 10px/1.4 var(--cond);letter-spacing:.2em;color:var(--yel)}
.stats dl{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin:0;padding:8px 12px 6px}
.stats dl div{display:flex;gap:6px;align-items:baseline;font:600 12.5px/1.75 var(--cond);text-transform:uppercase;letter-spacing:.06em}
.stats dt{color:var(--ink2)}
.stats dl div i{flex:1;border-bottom:2px dotted #b9ae96;transform:translateY(-4px)}
.stats dd{margin:0;font-weight:700}
.swatches{display:flex;gap:8px;padding:0 12px 10px;font:600 11px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;align-items:center;flex-wrap:wrap}
.swatches span{display:flex;align-items:center;gap:5px}
.swatches i{width:16px;height:16px;border:2px solid var(--ink);display:inline-block}
.bio-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.bio-nav span{font:400 14px/1 var(--head)}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tabs button{border:2px solid var(--ink);background:var(--paper);padding:5px 8px 4px;font:700 11px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs button:hover{background:var(--yel);color:var(--ink)}
.grouph{font:400 17px/1.1 var(--head);margin:4px 0 10px;transform:skewX(-9deg);transform-origin:0 100%}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cell{border:2px solid var(--ink);background:var(--ink);padding:0;display:block;text-align:center;position:relative}
.cell canvas{width:100%;height:auto}
.cell span{display:block;background:var(--paper);font:700 10px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:4px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell[aria-current="true"]{outline:3px solid var(--red);outline-offset:1px}
.cell[aria-current="true"] span{background:var(--red);color:#fff}
.cell:hover span{background:var(--yel)}
.cwrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0;font:700 10.5px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase}
.cwrow button{border:2px solid var(--ink);background:#fff;padding:5px 9px 4px;font:700 11px/1 var(--cond);letter-spacing:.06em;box-shadow:2px 2px 0 var(--ink)}
.cwrow button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* character select page */
.selwrap{position:relative}
#dm-select-slot{min-height:200px}
#selWrap .dms-title{display:none}
body.book-mode #selWrap > #dm-select-slot{max-height:478px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.selbar span{font:700 10.5px/1.3 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
body.phone-mode .selbar span{display:none}
.foldout{position:fixed;inset:0;z-index:150;background:rgba(27,23,18,.82);display:none;padding:56px 16px 16px;overflow:auto}
.foldout.open{display:block}
.foldout .fo-inner{max-width:1200px;margin:0 auto;background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 #000;padding:16px;position:relative}
.foldout .fo-close{position:fixed;top:12px;right:16px;z-index:151}

/* secret codes + roster entries */
.code-list{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:5px}
.code-list li{border-left:6px solid var(--blue);padding:1px 0 1px 10px;font-size:12px;line-height:1.45}
.code-list b{display:block;font:400 13.5px/1.25 var(--head)}
.rentry{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;padding:6px 0 5px;border-bottom:1px solid #cdbfa3}
.rentry canvas{width:62px;height:68px;border:2px solid var(--ink);background:var(--ink)}
.rn{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rn b{font:400 15px/1.1 var(--head);transform:skewX(-8deg);transform-origin:0 100%;display:inline-block}
.rn span{font:700 10px/1.2 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--red);white-space:nowrap}
.rnote{margin:2px 0 2px;font:12px/1.35 var(--cond);letter-spacing:.01em}
.rrec{margin:0;font:9.4px/1.35 var(--mono);color:#26324a;overflow-wrap:anywhere}
.rgh{font:400 15px/1.1 var(--head);margin:8px 0 2px;padding:5px 9px 4px;background:var(--ink);color:var(--paper);transform:skewX(-8deg);transform-origin:0 100%;display:inline-block}
.rgh:first-child{margin-top:0}
.jumps{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.jumps button{border:2px solid var(--ink);background:var(--paper);padding:5px 8px 4px;font:700 11px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;box-shadow:2px 2px 0 var(--ink)}
.jumps button:hover{background:var(--yel)}
.rfoot{margin-top:10px;font:700 11px/1.4 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}

/* stages */
.stagebtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.stagebtns button{border:2px solid var(--ink);background:var(--paper);padding:7px 4px 6px;font:700 10.5px/1.15 var(--cond);letter-spacing:.06em;text-transform:uppercase;box-shadow:2px 2px 0 var(--ink);border-top:7px solid var(--acc,#000)}
.stagebtns button b{display:block;font:400 15px/1 var(--head)}
.stagebtns button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.legend{width:100%;border-collapse:collapse;margin-top:10px;font:600 12.5px/1.3 var(--cond)}
.legend th{text-align:left;font:700 10.5px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase;border-bottom:3px solid var(--ink);padding:5px 4px}
.legend td{border-bottom:1px solid #c9bea5;padding:6px 4px;text-transform:uppercase;letter-spacing:.05em}
.legend td i{display:inline-block;width:14px;height:14px;border:2px solid var(--ink);vertical-align:-2px;margin-right:7px}
.who{margin-top:10px;font:600 12px/1.5 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.castrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.dialect{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;border-top:4px solid var(--ink);padding-top:10px;gap:12px}
.dialect b{display:block;font:700 11px/1 var(--cond);letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.dialect span{display:block;font:400 26px/1.1 var(--head);transform:skewX(-9deg);transform-origin:0 100%;margin:6px 0 4px}
.dialect small{font:italic 12px/1.4 var(--serif);color:var(--ink2)}
.dialect em{font:400 150px/.8 var(--head);font-style:normal;color:transparent;-webkit-text-stroke:3px var(--ink);
  background:radial-gradient(var(--red) 1.6px,transparent 2px) 0 0/7px 7px;-webkit-background-clip:text;background-clip:text;transform:skewX(-9deg)}
.fineprint{position:absolute;left:42px;right:42px;bottom:46px;font:11px/1.45 var(--cond);letter-spacing:.02em;color:var(--ink2);border-top:1px solid #bfb398;padding-top:7px;margin:0}
body.phone-mode .fineprint{position:static;margin-top:16px}
/* tips */
.tip{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-bottom:2px dashed #b9ae96;padding:6px 0}
.tip:last-child{border-bottom:0}
.tip em{display:inline-block;background:var(--red);color:#fff;font:400 11px/1 var(--head);padding:4px 7px 3px;transform:skewX(-10deg);letter-spacing:.06em;font-style:normal}
.tip q{display:block;font:italic 13.5px/1.38 var(--serif);margin:4px 0 2px;quotes:"\201C" "\201D"}
.tip small{font:700 10.5px/1.2 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.tip .plate{width:66px}

/* hint line (fallback inside the select slot) */
.forge{display:flex;gap:8px;margin:10px 0 12px}
.forge input{flex:1;min-width:0;border:3px solid var(--ink);background:#fff;padding:9px 10px;font:600 16px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.feed{position:relative;padding:0 26px;background:
  radial-gradient(circle at 12px 14px,#cdbf9f 4.5px,transparent 5px) 0 0/26px 28px repeat-y,
  radial-gradient(circle at 14px 14px,#cdbf9f 4.5px,transparent 5px) 100% 0/26px 28px repeat-y,
  repeating-linear-gradient(180deg,#fbfbf3 0 28px,#dcefdc 28px 56px);border-left:1px dashed #b5a988;border-right:1px dashed #b5a988;min-height:250px}
.feed::before,.feed::after{content:"";position:absolute;top:0;bottom:0;width:1px;border-left:1px dashed #c9bd9c}
.feed::before{left:25px}.feed::after{right:25px}
.printout{padding:14px 10px 12px;display:flex;gap:14px;align-items:flex-start}
.printout .plate{width:150px;flex:none}
.pr-lines{font:700 12.5px/1.75 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:#26324a;min-width:0}
.pr-lines div{overflow-wrap:anywhere}
.pr-lines .rc span{display:inline-block;margin-right:10px}
.tries{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font:700 11px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase}
.tries button{border:2px solid var(--ink);background:#fff;padding:5px 9px 4px;font:700 11.5px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;box-shadow:2px 2px 0 var(--ink)}
.tries button:hover{background:var(--yel)}
.pr-lines .big{font:400 22px/1.1 var(--head);color:var(--ink);text-transform:uppercase;margin-bottom:6px;overflow-wrap:anywhere}
.head{position:absolute;left:20px;right:20px;height:10px;top:0;background:linear-gradient(#3a3a3a,#111);border-radius:3px;opacity:0;z-index:3;box-shadow:0 2px 0 rgba(0,0,0,.2)}

/* making of, rules, numbers */
.phases{list-style:none;padding:0;margin:0}
.phases li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid #cbbfa5}
.phases b.n{font:400 20px/1 var(--head);color:var(--blue)}
.phases h4{margin:0;font:700 13px/1.2 var(--cond);letter-spacing:.12em;text-transform:uppercase}
.phases p{margin:1px 0 0;font-size:11.2px;line-height:1.4}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rules li{border-left:6px solid var(--red);padding:2px 0 2px 10px}
.rules b{display:block;font:400 14px/1.2 var(--head)}
.rules span{font-size:12px;line-height:1.45}
.numbers{margin-top:12px;border:3px solid var(--ink)}
.numbers table{width:100%;border-collapse:collapse}
.numbers td{padding:3px 10px;border-top:1px solid #cbbfa5;font:600 12.5px/1.3 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.numbers td:first-child{font:400 17px/1 var(--head);color:var(--red);width:112px;text-align:right;white-space:nowrap}

/* process */
.chap{display:flex;align-items:flex-end;gap:12px;margin:0 0 12px;border-bottom:5px solid var(--ink);padding-bottom:6px}
.chap span{font:700 11px/1 var(--cond);letter-spacing:.26em;color:var(--red);white-space:nowrap;padding-bottom:4px}
.chap h2{margin:0;font:400 26px/1 var(--head);transform:skewX(-10deg);transform-origin:0 100%}
.chap.cont h2{font-size:17px;color:var(--ink2)}
.director{position:relative;margin:10px 0 12px;padding:10px 14px 10px 16px;background:rgba(255,255,255,.55);border:2px solid var(--ink);border-left:8px solid var(--red);font:italic 14px/1.45 var(--serif)}
.director::before{content:"THE DIRECTOR";display:block;font:700 9.5px/1 var(--cond);letter-spacing:.26em;color:var(--red);font-style:normal;margin-bottom:5px}
.fig{margin:8px 0 10px}
.fig button{display:block;width:100%;padding:0;border:3px solid var(--ink);background:var(--ink);box-shadow:4px 4px 0 rgba(27,23,18,.25);cursor:zoom-in;position:relative}
.fig img{display:block;width:100%;height:var(--fh,200px);object-fit:cover;object-position:top center}
.fig button::after{content:"TAP TO ENLARGE";position:absolute;right:6px;bottom:6px;background:var(--yel);color:var(--ink);border:2px solid var(--ink);font:700 9px/1 var(--cond);letter-spacing:.16em;padding:3px 5px 2px}
.fig figcaption{font:11px/1.45 var(--cond);letter-spacing:.01em;color:var(--ink2);margin-top:6px}
.fig figcaption b{color:var(--ink)}
.rooms5{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.rooms5 figure{margin:0}
.rooms5 .rtag{display:flex;justify-content:space-between;gap:6px;font:700 10px/1.2 var(--cond);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.rooms5 .rtag b{font:400 12px/1.1 var(--head);letter-spacing:0;text-transform:none}
.rooms5 .rtag span{color:var(--red)}
.rooms5 img{--fh:auto;height:auto;image-rendering:pixelated}
.rooms5 .fig{margin:0}
.rooms5 figcaption{font-size:10.5px;line-height:1.35}
.rooms5 > .note{align-self:start}
.chlist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.chlist button{display:flex;gap:10px;align-items:baseline;width:100%;border:0;border-bottom:1px solid #cbbfa5;background:none;padding:4px 2px;text-align:left;font:600 14px/1.2 var(--cond);letter-spacing:.04em;text-transform:uppercase}
.chlist button b{font:400 14px/1 var(--head);color:var(--red);width:28px}
.chlist button:hover{background:var(--yel)}
.linkish{border:0;background:none;padding:0;color:var(--blue);text-decoration:underline;font:inherit;cursor:pointer}
.rooms5 .fig button::after{display:none}
.lineup canvas,#crewRow,#formRow{image-rendering:auto}

/* code */
.files{width:100%;border-collapse:collapse;margin:8px 0 10px}
.files td{border-top:2px solid var(--ink);padding:5px 4px;vertical-align:top;font-size:11.4px;line-height:1.42}
.files td:first-child{font:700 11.5px/1.3 var(--mono);white-space:nowrap;color:var(--blue)}
.steps{margin:0;padding-left:22px}
.steps li{margin:0 0 5px;font-size:11.8px;line-height:1.45}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px}
.dl button{border:2px solid var(--ink);background:var(--yel);padding:7px 10px 6px;font:700 11.5px/1 var(--mono);box-shadow:3px 3px 0 var(--ink)}
.dl button.alt{background:var(--paper)}
.dl button.nu{background:#fff;position:relative}
.dl button.nu::after{content:"NEW";position:absolute;right:-6px;top:-8px;background:var(--red);color:#fff;font:700 8px/1 var(--cond);letter-spacing:.12em;padding:2px 3px 1px;border:1.5px solid var(--ink)}
.listing.tight pre{font-size:10px;line-height:1.38;background:repeating-linear-gradient(180deg,#fff 0 13.8px,#f2f6ff 13.8px 27.6px)}
.dl button:hover{background:#fff}
.codestats{font:700 12px/1.4 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:2px 0 4px}
.listing{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(27,23,18,.25);margin:8px 0}
.listing .lh{display:flex;justify-content:space-between;align-items:center;background:var(--blue);color:#fff;padding:5px 8px 5px 10px;font:700 11px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase}
.listing .lh button{border:2px solid #fff;background:transparent;color:#fff;padding:4px 8px;font:700 10.5px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.listing pre{margin:0;padding:8px 10px;font:10.6px/1.5 var(--mono);white-space:pre-wrap;color:#1a2b4f;background:repeating-linear-gradient(180deg,#fff 0 15.9px,#f2f6ff 15.9px 31.8px);overflow-wrap:anywhere}
.schema{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:10.6px}
.schema th{text-align:left;font:700 10px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase;border-bottom:3px solid var(--ink);padding:4px 4px}
.schema td{border-bottom:1px solid #cbbfa5;padding:4px 4px;vertical-align:top;font:10.2px/1.38 var(--mono)}
.schema td:first-child{font-weight:700;color:var(--blue);white-space:nowrap}
.schema td:nth-child(2){text-align:right;font-weight:700}
.note{border:2px dashed var(--ink);background:rgba(46,139,87,.1);padding:8px 11px;margin:10px 0;font:12px/1.45 var(--cond)}
.note b{font:400 12.5px/1.2 var(--head);display:block;margin-bottom:2px}
.plain{margin:0 0 8px;padding-left:18px}
.plain li{margin:0 0 6px;font-size:12px;line-height:1.45}

/* warranty, notes, back */
.warranty{border:3px double var(--ink);border-width:6px;padding:14px 16px;background:rgba(255,255,255,.3)}
.warranty h3{margin:0 0 4px;font:400 22px/1 var(--head);text-align:center;transform:skewX(-8deg)}
.warranty .fine{font:13px/1.5 var(--cond);letter-spacing:.01em}
.warranty h4{margin:10px 0 4px;font:700 12px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.warranty ul{margin:0;padding-left:18px;font:13px/1.5 var(--cond)}
.coupon{margin-top:20px;border:2px dashed var(--ink);padding:12px 14px;position:relative;display:flex;gap:14px;align-items:center;background:rgba(255,207,31,.18)}
.coupon::before{content:"CUT ALONG THE DOTTED LINE";position:absolute;top:-10px;left:14px;background:var(--paper);padding:0 6px;font:700 10px/1.4 var(--cond);letter-spacing:.2em}
.coupon svg{width:74px;height:74px;flex:none}
.coupon b{display:block;font:400 15px/1.1 var(--head)}
.coupon span{font:12.5px/1.45 var(--cond)}
.partsbin{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.partsbin div{border:2px solid var(--ink);background:#fff;padding:6px 8px;display:flex;justify-content:space-between;align-items:baseline;font:700 12px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase}
.partsbin b{font:400 18px/1 var(--head);color:var(--blue)}
.starring{margin-top:8px}
.starring .row{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:4px}
.starring .row .plate{border-width:2px}
.lined{background-image:repeating-linear-gradient(180deg,transparent 0 31px,#9fb7d8 31px 32px);background-position:0 6px;min-height:400px;position:relative;border-left:2px solid rgba(225,37,27,.55);padding-left:12px}
.lined a,.lined div,.lined button{display:flex;gap:8px;align-items:baseline;font:600 14px/32px var(--cond);letter-spacing:.04em;text-decoration:none;color:var(--ink);text-transform:uppercase;width:100%;border:0;background:none;padding:0;text-align:left}
.lined a i,.lined button i{flex:1;border-bottom:2px dotted var(--faint);transform:translateY(-8px)}
.lined a b,.lined button b{color:var(--blue);font-weight:700;text-transform:none;letter-spacing:0}
.lined a:hover b,.lined button:hover b{color:var(--red)}
.page.back{background-color:#F0E7CF}
.bk-top{background:var(--red);color:#fff;margin:-36px -42px 12px;padding:18px 42px 12px;border-bottom:5px solid var(--ink)}
.bk-top b{display:block;font:400 28px/1 var(--head);transform:skewX(-10deg);transform-origin:0 100%}
.bk-top span{font:italic 13px/1.4 var(--serif)}
.bk-feats{list-style:none;margin:0 0 10px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.bk-feats li{font:700 11.5px/1.25 var(--cond);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:7px;align-items:baseline}
.bk-feats li b{font:400 17px/1 var(--head);color:var(--blue);white-space:nowrap}
.bk-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:16px}
.barcode{flex:none;width:130px;height:64px;background:#fff;border:2px solid var(--ink);padding:6px 6px 14px;position:relative}
.barcode::after{content:"0 12921 35180 5";position:absolute;bottom:2px;left:0;right:0;text-align:center;font:9px/1 var(--mono);letter-spacing:.18em}

/* lightbox */
dialog.lightbox{border:3px solid var(--ink);padding:0;background:var(--paper);max-width:min(96vw,1500px);max-height:94vh;box-shadow:10px 10px 0 #000}
dialog.lightbox::backdrop{background:rgba(20,16,10,.82)}
.lb-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:8px 10px 8px 14px;font:700 11px/1.3 var(--cond);letter-spacing:.14em;text-transform:uppercase;z-index:2}
.lb-bar button{border:2px solid var(--paper);background:var(--red);color:#fff;padding:5px 10px;font:700 12px/1 var(--cond);letter-spacing:.14em}
dialog.lightbox img{display:block;max-width:100%;height:auto}
dialog.lightbox p{margin:0;padding:10px 14px 14px;font:13px/1.5 var(--cond);max-width:900px}

/* ---------- column: phone and "one page" ---------- */
#column{display:none}
body.phone-mode #column{display:flex;flex-direction:column;gap:16px;padding:66px 10px 40px}
body.phone-mode.onepage #column{max-width:700px;margin:0 auto;padding-left:16px;padding-right:16px}
body.phone-mode #desk,body.phone-mode .ctl{display:none}
body.phone-mode .page{width:100%;height:auto;min-height:0;padding:30px 20px 50px;box-shadow:0 6px 18px rgba(60,45,20,.28);scroll-margin-top:64px}
body.phone-mode .page.cover{height:auto;min-height:0;padding:0;display:flex;flex-direction:column}
body.phone-mode .cv-band{position:relative;flex:none}
body.phone-mode .cv-logo{position:relative;left:auto;right:auto;top:auto;margin:10px 30px 0}
body.phone-mode .cv-cast{position:relative;left:auto;top:auto;width:100%;height:auto;margin-top:-24px}
body.phone-mode .cv-band{font-size:10px;letter-spacing:.12em;padding:0 12px;height:auto;min-height:38px}
body.phone-mode .cv-band span:first-child{display:none}
body.phone-mode .cv-band{justify-content:center}
body.phone-mode .cv-seal{top:-30px;right:8px;width:80px;height:80px}
body.phone-mode .cv-title{position:relative;height:auto;padding:16px 96px 16px 18px}
body.phone-mode .cv-title em{position:static;display:block;text-align:left;margin-top:10px}
body.phone-mode .dogear,body.phone-mode .staple{display:none}
body.phone-mode .bk-top{margin:-30px -20px 16px;padding:22px 20px 16px}
body.phone-mode .fig img{height:auto;object-fit:contain}
body.phone-mode .fig button::after{content:"ENLARGE"}
body.phone-mode .rgh{transform:none}

const rosterNote = k => cleanText(DM.meta(k).note);
const rosterEra = k => cleanText(DM.meta(k).era);
function entryHtml(k, id){
  const m = DM.meta(k);
  return `<div class="rentry"${id ? ` id="${id}"` : ""}><canvas data-rk="${k}" width="62" height="68" aria-hidden="true"></canvas><div><div class="rn"><b>${esc(m.name)}</b><span>${esc(rosterEra(k))}</span></div><p class="rnote">${esc(rosterNote(k))}</p><p class="rrec">${esc(DM.recipeLine(k))}</p></div></div>`;
}
function estEntry(k){ const n = rosterNote(k).length, r = DM.recipeLine(k).length; const nl = n <= 82 ? 1 : n <= 168 ? 2 : 3, rl = r <= 139 ? 2 : 3; return Math.max(81, 21 + 16.3 * nl + 12.8 * rl); }
const ROSTER_BUDGET = 642;
let rosterLastH = 0;
function rosterPages(){
  const pages = []; let cur = [], h = 0;
  const flush = () => { if (cur.length) { pages.push(cur); rosterLastH = h; } cur = []; h = 0; };
  for (const g of GROUPS) {
    const head = { head: g.key, h: 45 };
    const first = g.keys[0];
    if (h + head.h + estEntry(first) > ROSTER_BUDGET) flush();
    cur.push(head); h += head.h;
    for (const k of g.keys) { const eh = estEntry(k); if (h + eh > ROSTER_BUDGET) flush(); cur.push({ key: k }); h += eh; }
  }
  flush();
  return pages;
}

add("what-it-is", "What It Is", `<div class="kick">Chapter 2</div><div class="band"><h2>WHAT IT IS</h2></div>

add("process", "The Process", `<div class="kick">The process · every screenshot below is a real artifact from the build</div><div class="band"><h2 class="mis">ATARI IN. NES OUT.</h2></div>

add("started", "Ch. 01 Where we started", `${chap("01", "Where we started")}
  <p class="dense">The project arrived as a handoff zip and a working live app. The plumbing was genuinely good: rooms, states, room memory, the bridge. The problem was the people. The characters were drawn with roughly <b>20×28 pixels of drawing space</b>: flat single tones, no outlines, no shading. Charming in motion, mush at a glance. The director's verdict set the whole agenda:</p>
  ${director(QUOTES.atari)}
  ${fig("batch1-review-top", "Batch 1 review page: the old renderer beside the new fine-grid renderer, hero check on Tesla", "<b>The problem, side by side.</b> The batch review pages pulled the exact old renderer from a pre-overhaul checkpoint (left) and drew the same character with the new fine-grid engine (right): same DNA, same palette, same pose. Tesla's hero check made the gap impossible to unsee: the old build reads as a blue blob with a lightning bolt; the new one reads as a <i>character</i>.", 420)}`, { tab: "process" });
add("started-2", "Ch. 01 continued", `${chap("01", "Where we started", true)}
  <p class="dense">Before any pixels moved, the code got an audit: contract tests wired with Playwright, regression gates, and checkpoints for every canonized state. That mattered later. It meant every visual change in this story shipped behind a failing-then-green test, and any approved look could be rolled back to.</p>
  <div class="plate"><canvas id="teslaRow" width="912" height="500" aria-label="Tesla, the hero check, in all three colorways"></canvas></div>
  <div class="cap"><b>Plate 2</b>Tesla, the hero check, as he ships today, in all three colorways</div>
  <div class="note"><b>Then and now</b>Then: about 20×28 pixels of drawing space, flat single tones, no outlines, no shading. Now: heroic chibi proportions, ink outlines, two-tone light and shadow, paper-bright eye glints, hard speculars. Chapter 02 is how that look got picked.</div>`);

add("dialect", "Ch. 02 Picking a dialect", `${chap("02", "Picking a dialect")}
  <p class="dense">"8-bit" names a hardware constraint with a dozen schools inside it. Super Mario Bros., Mega Man, Metroid and Zelda are all 8-bit and look nothing alike; calling them one style is like calling Akira Toriyama and Hayao Miyazaki interchangeable. So before rebuilding anything, we ran a <b>style shootout</b>: the same two characters, Tesla (humanoid) and Hopper (creature body plan), rendered five ways, all from the same three palette tokens so the colorway system would survive whichever dialect won.</p>
  ${fig("proc-shootout-top", "8-bit style shootout: NOW versus four candidate dialects, Tesla and Hopper rows", "<b>The shootout page.</b> Column 1 is what shipped at the time. A-D are the candidates: <b>Plumber Chunk</b> (SMB3/Kirby: giant heads, thick black outlines), <b>Blue Bomber</b> (Mega Man/Capcom: heroic chibi, crisp ink, 2-tone metal shading, eye glints), <b>Dark Sector</b> (Metroid/Contra: lean, dithered, moody) and <b>Storybook Quest</b> (Zelda/Dragon Quest: warm, soft, self-colored outlines).", 320)}`, { tab: "process" });
add("dialect-2", "Ch. 02 continued", `${chap("02", "Picking a dialect", true)}
  <p class="dense">Dark Sector put up a fight (it's genuinely cool) but the decision came back fast:</p>
  ${director(QUOTES.bomber)}
  <p class="dense">That one call fixed the art direction for everything after: <b>heroic chibi proportions, ink outlines, two-tone light/shadow flanks derived mechanically from the palette, paper-bright eye glints, hard speculars.</b> Every part, room, and character below is drawn in that dialect.</p>
  <div class="plate"><canvas id="dialectRow" width="912" height="520" aria-label="Tesla and Hopper, the shootout pair, with Curie, Galileo, Saitama and Plato, all in Blue Bomber"></canvas></div>
  <div class="cap"><b>Plate 3</b>Tesla and Hopper, the shootout pair, with Curie, Galileo, Saitama and Plato. All Blue Bomber.</div>`);

add("loop", "Ch. 03 The review loop", `${chap("03", "The review loop")}
  <p class="dense">The working rhythm never changed: build a batch of parts &#8594; render them on an <b>isolated review page</b> (never live in the app) &#8594; the director gives notes &#8594; fix &#8594; re-show &#8594; approve &#8594; canonize behind the gates. Three batches rebuilt the entire parts library:</p>
  <h3 class="sub">Batch 1 · bodies, heads, faces</h3>
  <p class="dense">Twelve bodies, twelve heads, ten faces. Real notes from this round, verbatim-ish: <i>"round and square look the same, round the round one rounder," "skull needs shadow where the cheeks would be," "make visor one line again, think Cyclops from X-Men," "deadpan is dashes for eyes and a longer dash for the mouth," "orb should be detached… moving independent of the body," "beak is in the eye lol fix it."</i> The orb ended up at 125% scale, drifting on its own clock. The canine head read feline, so it got renamed feline and a new floppy-eared canine was drawn from scratch. Skull face and skull head fused into one all-or-nothing option.</p>
  <div class="plate"><canvas id="bodyRow" width="912" height="440" aria-label="One character for each body type"></canvas></div>
  <div class="cap" id="bodyCap"></div>`, { tab: "process" });
add("loop-2", "Ch. 03 continued", `${chap("03", "The review loop", true)}
  <h3 class="sub" style="margin-top:0">Batch 2 · hats, outfits, shells, props</h3>
  ${fig("batch2-hero", "Batch 2 review: Bernoulli probable-fluid preview and the hats grid, now versus batch 2", "<b>Batch 2's hero card and hat grid.</b> Every cell shows <i>now</i> vs <i>batch 2</i> so only the part under review changes. Up top: Jacob Bernoulli's probable-fluid flask: the fluid phases in and out on a slow sine, because it is only <i>probably</i> there. (The nerdiest joke in the whole build, and the director's favorite.) Also this round: curlier curls, a bandana with a tail that moves, a thicker halo, rugged spikes, coil springs that actually sproing.", 280)}
  <p class="dense">Bodies took their own notes: tiny got 30% smaller <i>with all parts scaled by percentage so everything stays in proportion</i>; the robe stopped looking like a dress; the fighter got svelte and ripped; the cyborg became a 50s wind-up robot covered in superfluous lights and buttons; the bird lost its tail ("looks like a dick lmfao", fair); blob and slime survived by differentiating instead of eliminating. Longlegs got the only zero-note approval in the project: <i>"${QUOTES.longlegs}"</i></p>`);
add("loop-3", "Ch. 03 continued", `${chap("03", "The review loop", true)}
  <h3 class="sub" style="margin-top:0">Batch 3 · auras</h3>
  ${fig("b3r2-full-t0", "Batch 3 aura review grid: fifteen auras, now versus batch 3, each with motion notes", "<b>The aura fine pass.</b> Fifteen legacy auras rebuilt with NES-grade detail and actual motion: static spots that teleport to brand-new positions on their own millisecond clocks, stars that drop and twinkle, a looming shadow silhouette that sways behind the body, rain in real rain-blue with nine dense lanes. The psychic aura took three attempts (\"wavy wifi icon\" wasn't it) until reference art of moondragon/Jean-Grey-style brainwaves produced the concentric head-rings plus floating third eye. The eye got bigger and more oval on the final note, and that was that.", 300)}
  <div class="plate"><canvas id="auraRow" width="912" height="240" aria-label="Six auras as they ship"></canvas></div>
  <div class="cap" id="auraCap"></div>`);

add("crew", "Ch. 04 The model crew", `${chap("04", "The model crew")}
  <p class="dense">The house characters, the agents you see every session, needed to out-dress everyone, and Sol (the Dream Machine itself, the one you see most) needed to look <b>the coolest</b>. Sol got a full shootout: a Gundam-spirit build, a crystalline ghost, a sun-knight, a not-at-all-evil ring wraith, an arcade ace, each in all three colorways.</p>
  ${fig("lab3-solGrid", "Sol redesign shootout grid: gundam-spirit, crystalline, sun-knight, hooded-wraith, arcade-ace, elf-sovereign", "<b>The Sol shootout.</b> Gundam-spirit, Crystalline and Sun-Knight were all good enough to keep: the losers got reserved for future weirdos rather than deleted. The winner was the late entry: <b>Elf Sovereign</b>, rounded 150% head, elf ears, Cyclops visor, spirit body, orbiting tokens. \"" + QUOTES.dope + "\", locked on sight.", 380)}`, { tab: "process" });
add("crew-2", "Ch. 04 continued", `${chap("04", "The model crew", true)}
  <p class="dense">The crew's props got their own pass in the Blue Bomber dialect: the cart-blade (more cart <i>and</i> more blade), a token shield with a relief-struck DM monogram at double size, a Kirby-style star wand, an oversized prize hammer, a prize claw, and the token railgun, which only earned approval once something visibly came out of it. Flash, Sonnet, Opus and the rest of the leads went through the same loop and shipped together.</p>
  ${director(QUOTES.dope)}
  <div class="plate"><canvas id="crewRow" width="912" height="260" aria-label="The model crew: Sol, Flash, Sonnet, Opus, Astra, Terra, Luna and DeepSeek"></canvas></div>
  <div class="cap"><b>Plate 6</b>The model crew, as they ship today</div>
  <div class="plate" style="margin-top:10px"><canvas id="solCw" width="912" height="300" aria-label="Sol in all three colorways: voidArcade, toxicCandy and spectralOxide"></canvas></div>
  <div class="cap"><b>Plate 7</b>Sol in all three colorways</div>`);

add("formulations", "Ch. 05 The 101 formulations", `${chap("05", "The 101 formulations")}
  <p class="dense">Then the twist that made everything easier: the agent roster is <b>finite</b>. 101 names, Euclid through Ramanujan, plus one Jason, which meant no more generative guessing. Each name got researched, and each got a hand-designed costume where every part is a joke, a tribute, or a fact. Ideally all three. Ambiguous references went back to the director: Franklin is <b>Rosalind</b> (DNA helix on the chest, obviously), Herschel settled a Caroline-vs-William shootout in William's favor, Zeno is the one from <b>Citium</b>, Bernoulli is <b>Jacob</b> (see: probable fluid), and Jason is exactly the Jason you're thinking of. Voorhees. Yes, really.</p>
  ${fig("f4-full-a", "Formulations batch 4 review page with the Herschel decision card and fifteen character cells", "<b>A formulations batch page.</b> Fifteen characters per batch, rendered live on an isolated page with the recipe and the design rationale under each one. Decision cards up top settle forks before they ship. Here, William Herschel (\"star diadem, cyan and violet, the man who found Uranus\") beat his sister's variant. Below the grid: design notes arguing the cases.", 300)}`, { tab: "process" });
add("formulations-2", "Ch. 05 continued", `${chap("05", "The 101 formulations", true)}
  <p class="dense">Seven batches, fifteen at a time, each approved in isolation with edits folded in: Newton's leaves went green, Faraday's static went yellow, Mendel got his leaves, Einstein got silver curls, Tesla's aura went blue static, Schrödinger became (and this was the director's favorite) <i>literally the cat</i>. The standing constraint was the <b>unique palette doctrine</b>: no two formulation recipes share a three-color set. By the final batch exactly one unused combination remained in the space. Ramanujan got it. Fitting.</p>
  <div class="plate"><canvas id="formRow" width="912" height="260" aria-label="Franklin, Herschel, Zeno, Bernoulli, Jason, Schrodinger and Ramanujan"></canvas></div>
  <div class="cap"><b>Plate 8</b>Franklin, Herschel, Zeno, Bernoulli, Jason, Schrödinger, Ramanujan</div>
  <div class="plate" style="margin-top:10px"><canvas id="finaleRow" width="912" height="420" aria-label="Batch 7, the finale"></canvas></div>
  <div class="cap"><b>Plate 9</b>Batch 7, the finale, Ramanujan included</div>`);

add("rooms", "Ch. 06 The rooms", `${chap("06", "The rooms")}
  <p class="dense">The rooms had the same Atari problem as the characters, and they carry the name: the Dream Machine was a real arcade in the Lincoln Mall, Lincoln, Rhode Island, early-to-mid 90s. We pulled what visual reference we could find for it, then rebuilt all five rooms the same way the characters were built: <b>three 8-bit dialect treatments per room</b>. Blue Bomber (ink outlines, flat fills), Dark Sector (dithered grime, deep shadow), and Neon Nights (mall arcade at night: dark base, neon trim, glow pools), laid out side by side, judged as dioramas.</p>
  ${fig("rooms-lab-full", "Room art shootout: five rooms, three dialect treatments each", "<b>The room shootout board.</b> All five rooms × three dialects on one page. The picks: <b>Main Floor C · Pinball Row A · Party Room C · Signal Observatory A · Agora Archive C</b>. Neon Nights for the arcade rooms (it <i>is</i> a mall arcade at night), Blue Bomber where readability matters most.", 330)}`, { tab: "process" });
add("rooms-2", "Ch. 06 continued", `${chap("06", "The rooms", true)}
  <div class="rooms5">${[
    ["forgeFloor", "DM Main Floor", "dialect C · neon nights", "DM Main Floor final: cabinet row, token machine, prize wall, lounge", "Cabinet row, token machine, prize wall, lounge. Sol holds court by the tokens."],
    ["nullArcade", "DM Pinball Row", "dialect A · blue bomber", "DM Pinball Row final: pinball machines, high scores board, ticket eater, soda and snack machines", "High scores (SOL holds 3rd), ticket eater, soda + snack machines. FEED ME."],
    ["dmParty", "DM Party Room", "dialect C · neon nights", "DM Party Room final: party tables, prize shelf, ball pit", "The new room: party tables, prize shelf, ball pit. Where ended crews go to decompress."],
    ["observatory", "Signal Observatory", "dialect A · blue bomber", "Signal Observatory final: star map, antenna bank, anomaly beacon", "Star map, antenna bank, anomaly beacon. The quiet room for watching signals come in."],
    ["agoraArchive", "Agora Archive", "dialect C · neon nights", "Agora Archive final: debate table, scroll stacks, glowing archive, philosopher pit", "Debate table, scroll stacks, objection podium, philosopher pit. Where the arguments live."]
  ].map(([k, n, d, alt, cap]) => `<div><div class="rtag"><b>${n}</b><span>${d}</span></div>${fig("rooms-l1-" + k, alt, cap)}</div>`).join("")}
  <div class="note" style="margin:0"><b>First edition rooms</b>These are the rooms as the first edition shipped them. Chapter 08 rebuilds them bigger, and Stage Select (chapter 5) runs the new ones live.</div></div>`);

add("now", "Ch. 07 The first edition", `${chap("07", "The first edition")}
  <p class="dense">All of it, every batch, every approval, every note, landed in the live build behind the regression gates, with a canonization ledger and hash-matched mirrors so any approved state can be verified or restored. This is the machine as the first edition shipped it:</p>
  ${fig("rooms-l1-fullpage", "The live Dream Machine app: rooms bar, Agora Archive room view, roster, bridge status", "<b>The live app.</b> Rooms bar up top (0/5 occupied, bridge live), the Agora Archive diorama in the middle with its station legend (stations are <i>states</i>, not job titles), roster and room memory below. Read-only, loopback-only, no cloud.", 190)}
  ${fig("live-scene", "Live roster grid: Faraday, Hypatia, Socrates, Laplace, Ampere, Boyle, Heisenberg, Kaneda and more, each with recipe lines", "<b>The roster, alive.</b> Science roster, Chaos roster, Anime bench: every card a formulation with its recipe line. Kaneda, Vegeta, Frieren and Alphonse share the bench with Boyle and Heisenberg. It is a weird building and we love it.", 150)}`, { tab: "process" });
add("now-2", "Ch. 07 continued", `${chap("07", "The first edition", true)}
  <p class="dense">The same engine that draws all of this is also the review tooling: the <b>Persona Forge</b> character creator, an RPG-style loadout screen where every slot is a real value from the shipped renderer, with a time-machine view that draws the same DNA in both eras.</p>
  ${fig("proc-forge-top", "Persona Forge character creator: loadout slots, live stage, pre/post overhaul comparison, slot vocabulary table", "<b>The Persona Forge.</b> Left: every slot as a dropdown of real renderer vocabulary. Center: the live stage. Right: the time machine: same DNA, pre-overhaul renderer vs post-overhaul renderer, plus the vocabulary growth table (+25 slot values across the overhaul). This page is how \"before and after\" stopped being an argument and started being a screenshot.", 280)}
  <p class="dense">And if you want to stand the whole character system up yourself, or hand it to another AI tool, the engine, the recipes, and the wiring instructions are on <button type="button" class="linkish" data-goto="code">the code page</button>. Plain script files, no build step, no bundler. The machine compiles its people from recipes; now you can too.</p>
  <div class="btnrow">${goBtn("Meet the 129", "roster")}${goBtn("Get the code", "code", "alt")}</div>`);

add("bigger", "Ch. 08 Bigger rooms", `${chap("08", "Bigger rooms")}
  <p class="dense">The first edition fixed the people. The rooms still had the Atari problem: a 960 by 540 grid, thin lines, small signs, and once a real crew showed up, guys stood on top of each other.</p>
  ${director(QUOTES.rooms)}
  <p class="dense">So every room was rebuilt on a <b>1280 by 720</b> grid with <b>34 places to stand</b>, thick ink outlines, shading on every prop and a new outlined pixel font. The still parts are painted once and reused, so the bigger rooms draw three to five times faster. Then the director looked closer at the cabinets:</p>
  ${director(QUOTES.cabs)}
  ${fig("ed2-cabinets", "The second edition cabinet row: SFII, MKII, TMNT, X-Men and OutRun, each screen showing its own game", "<b>The cabinet row, up close.</b> Two fighters on SFII, a stone arena on MKII, turtles against a Foot ninja on TMNT, the X-Men against a Sentinel, and OutRun, which took Dig Dug's spot because it has fewer letters.", 176)}`, { tab: "process", nu: true });
add("bigger-2", "Ch. 08 continued", `${chap("08", "Bigger rooms", true)}
  <div class="rooms5 ed2">${ED2_ROOMS.map(([k, n, alt, cap]) => `<div><div class="rtag"><b>${n}</b><span>second edition</span></div>${fig("ed2-" + k, alt, cap)}</div>`).join("")}
  <div class="note" style="margin:0"><b>Walk in yourself</b>Stage Select (chapter 5) runs these rooms live, with a cast walking around in them. The code chapter has the room file, so you can build your own.</div></div>`, { nu: true });
add("bigger-3", "Ch. 08 continued", `${chap("08", "Bigger rooms", true)}
  <h3 class="sub" style="margin-top:0">Labels that stay out of the way</h3>
  <p class="dense">Bigger rooms meant bigger crews, and a name tag over every head started to crowd the floor. The note: <i>"${QUOTES.labels}"</i> So the labels got five modes, picked from a menu:</p>
  <ul class="plain">${LABEL_MODES.map(([t, b]) => `<li><b>${t}.</b> ${b}</li>`).join("")}</ul>
  ${fig("ed2-labels", "A crowded Main Floor with smart labels: name tags for the guy you picked and the one who needs you, small job icons for everyone else", "<b>Smart labels.</b> Twenty-one guys on one floor. Alphonse is picked and Vegeta needs you, so they get name tags. Everyone else gets a small icon for the job: research, build, test, design, red team, review.", 200)}`, { nu: true });

add("code", "The Code", `<div class="kick">Chapter 8 · Programming notes</div><div class="band blue"><h2>THE CODE</h2></div>
  <p class="dense">Everything below is <b>real, running code</b> extracted from the live build, not pseudocode. Hand this page (and the JS files) to a friend or another AI tool and they can stand the whole character system up anywhere there's a canvas.</p>
  <div class="dl" id="dlRow"><button type="button" data-dl="persona-module.js">persona-module.js</button><button type="button" data-dl="persona-engine.js">persona-engine.js</button><button type="button" class="alt" data-dl="meta.js">meta.js</button><button type="button" class="alt" data-dl="persona-live.js">persona-live.js</button></div>
  <p class="codestats" id="codeStats"></p>
  <p class="small" style="margin:0 0 4px">Everything for the character system: schema, parts, recipes, engine. New in the second edition: the rooms and a one-file starter, in <button type="button" class="linkish" data-goto="rooms-code">Put Them in a Room</button>.</p>
  <h3 class="sub">1 · The files</h3>
  <table class="files"><thead class="sr"><tr><th>file</th><th>what it is</th></tr></thead>
    <tr><td>persona-module.js</td><td><b>The brain.</b> Extracted verbatim from the live app: the schema version, per-slot defaults, the full parts library (PERSONA_SLOTS), all 129 recipes (PERSONA_RECIPES), name normalization, validation, the deterministic generated-DNA fallback for unknown names, and <code>TeamLoopPersona.compile(name)</code>. Data + logic only, no drawing.</td></tr>
    <tr><td>persona-engine.js</td><td><b>The body.</b> The canvas drawing layer: colorways, palettes, the stage backdrop, and every part renderer (bodies, heads, faces, hats, outfits, shells, props, auras, motifs) at 2px resolution. Ends with a convenience <code>drawCharacter(ctx, x, y, scale, dna, palette, time, seed)</code>.</td></tr>
    <tr><td>meta.js</td><td><b>The story.</b> Display names, eras, design notes, and roster grouping for every character. Optional: the system runs fine without it.</td></tr>
  </table>`, { toc: "The Code", part: "The Code" });

add("wire-it-up", "Wire It Up", `<div class="kick">Chapter 8, continued</div><div class="band blue"><h2>2 · WIRE IT UP (5 STEPS)</h2></div>
  <ol class="steps">
    <li><span class="sr">step 1. </span>Load the scripts in order: persona-module.js, persona-engine.js, persona-live.js, meta.js. Plain script tags, no bundler.</li>
    <li><span class="sr">step 2. </span>Get DNA: <code>const dna = TeamLoopPersona.compile("Sagan")</code>. Known names return their fixed recipe; unknown names get a deterministic generated build.</li>
    <li><span class="sr">step 3. </span>Pick a palette: <code>const pal = paletteCW("voidArcade", dna.colors[0], dna.colors[1], dna.colors[2])</code>.</li>
    <li><span class="sr">step 4. </span>Draw each frame: <code>DM_LIVE.drawCharacter(ctx, x, y, scale, dna, pal, performance.now(), seed)</code>. Set <code>imageSmoothingEnabled = false</code>.</li>
    <li><span class="sr">step 5. </span>Add your own character: append one recipe object to PERSONA_RECIPES with a unique palette set. That's the whole API.</li>
  </ol>
  <div class="listing"><div class="lh">minimal page<button data-copy="quickstart">Copy</button></div><pre id="lsQuick"></pre></div>`, { toc: "Wire It Up" });

add("schema", "The Recipe Schema", `<div class="kick">Chapter 8, continued</div><div class="band blue"><h2>3 · THE RECIPE SCHEMA</h2></div>
  <p class="dense">A recipe is one flat object. Missing slots fall back to defaults (<code>body:"tiny", head:"round", face:"dots", hat:"none", outfit:"coat", shell:"none", prop:"none", aura:"none", motif:"none"</code>). <code>colors</code> is exactly three channel names; channel roles are <b>base</b> (skin/primary), <b>secondary</b> (garments/major surfaces) and <b>accent</b> (details, aura energy, trim). Available channels: bronze, steel, gold, cyan, violet, mint, paper, silver, rust.</p>
  <table class="schema" id="schemaTable"><thead><tr><th>slot</th><th>#</th><th>options</th></tr></thead><tbody></tbody></table>`, { toc: "Recipe Schema" });

add("example-recipes", "Example Recipes", `<div class="kick">Chapter 8, continued</div><div class="band blue"><h2>4 · EXAMPLE RECIPES</h2></div>
  <h3 class="sub" style="margin-top:0">House rules we held to (recommended)</h3>
  <ul class="plain">
    <li><b>Unique palette sets (the formulation doctrine).</b> The 101 held to it strictly: no two formulation recipes share a three-color set, 100 unique sets across the batches, with legacy house recipes grandfathered in. The space is nearly exhausted; choose like it matters.</li>
    <li><b>The costume matches the reference.</b> Every part should be a joke, a tribute, or a fact. Ideally all three.</li>
    <li><b>provenance:"original"</b> marks hand-designed recipes; generated DNA is the fallback, never a substitute for taste.</li>
  </ul>
  <div class="listing"><div class="lh">three recipes<button data-copy="examples">Copy</button></div><pre id="lsExamples"></pre></div>`, { toc: "Example Recipes" });

add("rooms-code", "Put Them in a Room", `<div class="kick">Chapter 8, continued · new in the second edition</div><div class="band blue"><h2>5 · PUT THEM IN A ROOM</h2></div>
  <p class="dense">The second edition rooms ship as one more script. It draws any of the five rooms on a 1280 by 720 canvas, in any colorway, and hands you every place a guy can stand. Your page moves the guys; the room file draws everything else.</p>
  <table class="files"><thead class="sr"><tr><th>file</th><th>what it is</th></tr></thead>
    <tr><td>dream-machine-rooms.js</td><td><b>The rooms.</b> <code>DM_ROOMS2.draw(ctx, room, colorway, still, time)</code> paints a room. <code>DM_ROOMS2.defs[room].zones</code> lists the places to stand by station: work, think, attention, complete, idle, queued. Load it after persona-engine.js, which has the colorways.</td></tr>
    <tr><td>persona-live.js</td><td><b>The live drawer.</b> The renderer from the app, with Sol's elf-sovereign head. <code>DM_LIVE.drawCharacter</code> takes the same arguments as the older drawCharacter.</td></tr>
    <tr><td>dream-machine-starter.html</td><td><b>All of it in one file.</b> Every script plus the room page on the facing page, already wired. Download it, double-click it, click the room to change rooms.</td></tr>
  </table>
  <div class="dl"><button type="button" class="nu" data-dl="dream-machine-rooms.js">dream-machine-rooms.js</button><button type="button" class="nu" data-dl="dream-machine-starter.html">dream-machine-starter.html</button></div>
  <ul class="plain"><li><b>Room keys:</b> forgeFloor, nullArcade, dmParty, observatory, agoraArchive. <code>DM_ROOMS2.order</code> has them in order.</li><li><b>Motion off:</b> pass <code>true</code> for still and nothing in the room moves.</li></ul>`, { toc: "Put Them in a Room", nu: true });
add("rooms-listing", "A Room Page", `<div class="kick">Chapter 8, continued · the room page</div>
  <div class="listing tight"><div class="lh">a room with a crew in it<button data-copy="room">Copy</button></div><pre id="lsRoom"></pre></div>`, { nu: true });

add("deploying", "Deploying", `<div class="kick">Chapter 8, continued</div><div class="band blue"><h2>6 · DEPLOYING THIS SITE</h2></div>
  <p class="dense">The site is fully static: no build step. Any static host works; it was made for Netlify. It is now one file, <code>index.html</code>, plus a share picture and a redirects file:</p>
  <ul class="plain">
    <li><b>Drag &amp; drop:</b> go to app.netlify.com/drop and drop the site folder (index.html, og.png, _redirects). Live in seconds.</li>
    <li><b>Netlify CLI:</b> <code>npx netlify deploy --dir=site --prod</code></li>
    <li><b>Git-connected:</b> push the folder, set publish directory to the site root, no build command.</li>
    <li><b>Local preview:</b> double-click index.html, or any static server.</li>
  </ul>
  <div class="note"><b>Old links still work</b>The old site had four pages. <code>_redirects</code> sends /process, /roster and /code (with or without .html) to the matching pages in this booklet, and the old section links like #rooms or #how still land in the right place.</div>
  <div class="note"><b>Two fixes in these downloads</b>persona-module.js now carries the two helpers (hash32 and pick) the old published copy called but never defined, so compile() really does take any name. persona-live.js is the newer drawer from the live app, with Sol's elf-sovereign head and the other parts the published engine is missing: load it after persona-engine.js and call <code>DM_LIVE.drawCharacter</code> with the same arguments.</div>
  <p class="rfoot">THE CODE · compiled, not drawn · take it, fork it, make weirder lil guys · ${goBtn("the roster", "roster", "alt")}</p>`, { toc: "Deploying" });

add("roster", "The Roster", `<div class="kick">Appendix · every card from the old roster page</div><div class="band grn"><h2>THE ROSTER</h2></div>
  <p class="dense">Every character compiled live from its recipe, no sprite files, just DNA. Filter by batch, or flip the colorway (the machine ships with three: <b>toxicCandy</b>, <b>spectralOxide</b>, <b>voidArcade</b>).</p>
  <p class="small">All 129 Dream Machine character formulations, animated live: the 101, the model crew, the anime block. Each card shows the name, the era, the design note and the full recipe line. The four Boyle test dummies live on the Secret Codes page.</p>

add("warranty", "Warranty", `<div class="kick">Chapter 9</div><div class="band"><h2>WARRANTY</h2></div>
  <div class="warranty"><h3 class="mis">90-DAY LIMITED WARRANTY</h3><p class="fine" style="text-align:center;margin-bottom:6px">THE DREAM MACHINE · LOCAL PRESENCE VISUALIZER</p>
    <p class="fine">The Dream Machine is warranted to the original user to be free of clouds, accounts and phone-home features for ninety (90) days, and for every day after that too.</p>
    <h4>This warranty covers</h4><ul><li>Reading only. The bridge serves session state as JSON on localhost and never writes anything.</li><li>Loopback only. It answers on 127.0.0.1 and nowhere else.</li><li>Honesty. ${esc(C.features[5].body)}</li><li>Room memory. Clear a room and its crew is saved, so you can bring the scene back.</li></ul>
    <h4>This warranty does not cover</h4><ul><li>Quarters. It does not take them.</li><li>Characters you name after your boss.</li><li>The real arcade. It closed a long time ago, and we miss it too.</li></ul></div>

function lineup(cv, keys, scale, rows = 1){

function colorwayPlate(cv, who, scale){

  });
}

function kitSources(){
  const mark = "/* ==== " + "vendor/persona-module.js ==== */";
  const s = [...document.scripts].find(x => x.textContent.includes(mark));
  if (!s) return null;
  const txt = s.textContent, out = {};
  const marks = [...txt.matchAll(/\/\* ==== ([^ ]+) ==== \*\/\n/g)];
  marks.forEach((mk, i) => {
    const start = mk.index + mk[0].length, end = i + 1 < marks.length ? marks[i + 1].index : txt.length;
    out[mk[1].split("/").pop()] = txt.slice(start, end).replace(/\n;\n$/, "\n").replace(/<\\\/script/gi, "<" + "/script").replace(/<\\!--/g, "<" + "!--");
  });
  // second edition rooms: the dm-rooms2 part script, inlined by the build
  const rooms = [...document.scripts].find(x => x.textContent.startsWith("/* part dm-rooms2 */\n"));
  if (rooms) out["dream-machine-rooms.js"] = "// dream-machine-rooms.js: The Dream Machine rooms, second edition. Load it after persona-engine.js.\n" +
    rooms.textContent.slice("/* part dm-rooms2 */\n".length).replace(/<\\\/script/gi, "<" + "/script").replace(/<\\!--/g, "<" + "!--");
  return out;
}
function dlBody(name, src){
  let body = src[name] || "";
  if (name === "persona-module.js") body = "// persona-module.js from The Dream Machine, with hash32 and pick included so compile() works for any name.\n" + (src["live-helpers.js"] || "") + "\n" + body;
  // meta.js ships with the public notes in place of the old review comments
  if (name === "meta.js" && typeof DM_PUBLIC_NOTES === "object") body += "\n// Public notes for the characters whose old notes were review comments.\n(function(){ const P = " + JSON.stringify(DM_PUBLIC_NOTES) + "; for (const k in P) if (CHARACTER_META[k]) CHARACTER_META[k].note = P[k]; })();\n";
  if (name === "dream-machine-starter.html") body = starterHtml(src);
  return body;
}
// The starter: the room page with its four scripts inlined, so one double-clicked file runs a room.
function starterHtml(src){
  // (the comment-opener pattern is spelled <!-{2} so this page's own script never contains one)
  const inline = s => s.replace(/<\/script/gi, "<\\/script").replace(/<!-{2}/g, "<\\!--");
  const libs = ["persona-module.js", "persona-engine.js", "persona-live.js", "dream-machine-rooms.js"].map(n => `<script>/* ${n} */\n${inline(dlBody(n, src))}\n<\/script>\n`).join("");
  const program = ROOMQUICK.slice(ROOMQUICK.lastIndexOf("<script>") + 8, ROOMQUICK.lastIndexOf("<\/script>"));
  return `<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Dream Machine starter</title>\n` +
    `<style>html,body{margin:0;background:#05030a;color:#f4f1ff;font:15px/1.5 system-ui,sans-serif}main{max-width:1280px;margin:0 auto;padding:16px}canvas{display:block;width:100%;height:auto;cursor:pointer}p{opacity:.8}</style>\n</head>\n<body>\n<main>\n` +
    `<canvas id="room" width="1280" height="720"></canvas>\n<p>The Dream Machine starter: five guys wandering a room. Click the room for the next one. Change the names in the last script to make your own crew. Every character is compiled from its name, so any name works.</p>\n</main>\n` +
    libs + `<script>${program}<\/script>\n</body>\n</html>\n`;
}
